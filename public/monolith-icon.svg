<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="portalGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Background obsidian polygon -->
  <polygon points="50,6 92,26 92,74 50,94 8,74 8,26" fill="#040914" stroke="#1e293b" stroke-width="2" />
  <!-- Monolith silhouette -->
  <polygon points="40,20 60,18 64,82 36,82" fill="#0b1329" stroke="#0284c7" stroke-width="1.5" />
  <!-- Vertical Cyan Energy Portal -->
  <ellipse cx="50" cy="50" rx="8" ry="24" fill="url(#portalGlow)" filter="url(#glowFilter)" />
  <ellipse cx="50" cy="50" rx="4" ry="18" fill="#ffffff" opacity="0.8" />
  <!-- Horizon light line -->
  <line x1="15" y1="80" x2="85" y2="80" stroke="#00f0ff" stroke-width="1" opacity="0.6" />
</svg>
